name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Capacitor
        run: npm install
      - name: Add Android platform
        run: npx cap add android && npx cap sync android
      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i '0,/<style name="AppTheme.NoActionBar"[^>]*>/s##&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EDIGIDAW-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
